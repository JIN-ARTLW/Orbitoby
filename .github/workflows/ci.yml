name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Python ${{ matrix.python-version }} regression
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install "uv==0.11.19"

      - name: Sync development environment
        run: |
          uv sync \
            --python "${{ matrix.python-version }}" \
            --group dev \
            --extra models

      - name: Ruff
        run: |
          uv run --group dev --extra models ruff check .
          uv run --group dev --extra models ruff format --check .

      - name: Tests
        run: |
          uv run --group dev --extra models python -m pytest -q


  colab-baseline:
    name: Colab baseline / Python 3.13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install "uv==0.11.19"

      - name: Create isolated Colab-baseline environment
        run: uv venv --python 3.13 .venv-colab

      - name: Install Colab-baseline dependencies
        run: |
          uv pip install \
            --python .venv-colab/bin/python \
            "numpy==2.1.3" \
            "duckdb==1.3.2" \
            "pandas==2.2.3" \
            "pyarrow==23.0.1" \
            "python-dotenv==1.2.3" \
            "pytz==2025.2" \
            "requests==2.32.4" \
            "pymsis==0.13.0" \
            "pytest==9.1.1" \
            "ruff==0.16.8"

      - name: Install Orbitoby without dependency replacement
        run: |
          uv pip install \
            --python .venv-colab/bin/python \
            --no-deps \
            -e .

      - name: Dependency consistency
        run: uv pip check --python .venv-colab/bin/python

      - name: Colab-baseline full regression
        run: .venv-colab/bin/python -m pytest -q

      - name: Colab API contract
        run: |
          .venv-colab/bin/python - <<'PY'
          from importlib.metadata import version

          import orbitoby
          from orbitoby import Archive

          expected = {
              "numpy": "2.1.3",
              "duckdb": "1.3.2",
              "pandas": "2.2.3",
              "pyarrow": "23.0.1",
              "python-dotenv": "1.2.3",
              "pytz": "2025.2",
              "requests": "2.32.4",
              "pymsis": "0.13.0",
          }

          for package, wanted in expected.items():
              actual = version(package)
              print(f"{package:14} {actual}")
              assert actual == wanted, (package, actual, wanted)

          assert version("orbitoby") == "0.1.1"
          assert orbitoby.__version__ == "0.1.1"

          required = (
              "fetch",
              "objects",
              "orbit",
              "orbit_summary",
              "space_weather",
              "window",
              "timeseries",
              "plot",
              "plot_timeseries",
              "msis_inputs",
              "msis_density",
          )

          missing = [
              name for name in required
              if not hasattr(Archive, name)
          ]

          assert not missing, missing

          print("COLAB API CONTRACT: PASS")
          PY


  wheel-colab:
    name: Built wheel / Colab baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install "uv==0.11.19"

      - name: Build package
        run: |
          rm -rf dist
          uv build

      - name: Find wheel
        shell: bash
        run: |
          WHEEL="$(find dist -maxdepth 1 -type f -name 'orbitoby-0.1.1-*.whl' -print | head -n 1)"

          if [ -z "$WHEEL" ]; then
            echo "orbitoby 0.1.1 wheel not found"
            exit 1
          fi

          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"
          echo "wheel=$WHEEL"

      - name: Create clean wheel environment
        run: uv venv --python 3.13 .venv-wheel

      - name: Install exact Colab baseline first
        run: |
          uv pip install \
            --python .venv-wheel/bin/python \
            "numpy==2.1.3" \
            "duckdb==1.3.2" \
            "pandas==2.2.3" \
            "pyarrow==23.0.1" \
            "python-dotenv==1.2.3" \
            "pytz==2025.2" \
            "requests==2.32.4"

      - name: Install built Orbitoby wheel normally
        run: |
          uv pip install \
            --python .venv-wheel/bin/python \
            "$WHEEL"

      - name: Verify wheel did not upgrade Colab baseline
        run: |
          .venv-wheel/bin/python - <<'PY'
          from importlib.metadata import version

          import orbitoby
          from orbitoby import Archive

          expected = {
              "orbitoby": "0.1.1",
              "numpy": "2.1.3",
              "duckdb": "1.3.2",
              "pandas": "2.2.3",
              "pyarrow": "23.0.1",
              "python-dotenv": "1.2.3",
              "pytz": "2025.2",
              "requests": "2.32.4",
          }

          for package, wanted in expected.items():
              actual = version(package)
              state = "PASS" if actual == wanted else "FAIL"
              print(
                  f"{state:4} "
                  f"{package:14} "
                  f"actual={actual} "
                  f"expected={wanted}"
              )
              assert actual == wanted

          assert orbitoby.__version__ == "0.1.1"

          required = (
              "fetch",
              "objects",
              "orbit",
              "orbit_summary",
              "space_weather",
              "window",
              "timeseries",
              "plot",
              "plot_timeseries",
          )

          missing = [
              name for name in required
              if not hasattr(Archive, name)
          ]

          assert not missing, missing

          print("BUILT WHEEL COLAB CONTRACT: PASS")
          PY

      - name: Dependency consistency
        run: uv pip check --python .venv-wheel/bin/python

      - name: Models extra smoke
        run: |
          uv pip install \
            --python .venv-wheel/bin/python \
            "pymsis==0.13.0"

          .venv-wheel/bin/python - <<'PY'
          import pymsis
          from orbitoby import Archive

          assert hasattr(Archive, "msis_inputs")
          assert hasattr(Archive, "msis_density")

          print("pymsis:", pymsis.__version__)
          print("MSIS API: PASS")
          PY
