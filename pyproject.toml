[project]
name = "orbitoby"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JIN-ARTLW", email = "andrewtaylorweir@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
orbitoby = "orbitoby:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
